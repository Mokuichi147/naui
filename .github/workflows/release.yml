# タグ (v0.3.0 など) を打つと、4 環境ぶんの Gallery をビルドして
# GitHub Release へ添付し、あわせて各クレートを crates.io へ公開する。
#
# Gallery は書庫 (tar.gz / zip) のほかに、OS ごとのパッケージでも配る。
# 作り方は examples/gallery/packaging/ にまとめてある。
#
#   macOS: .app を入れた .dmg
#   Windows: .msi (WiX) とインストーラーの .exe (Inno Setup)
#   Linux: .deb (cargo-deb)
#
# どれも未署名 (macOS は ad-hoc 署名だけ)。
#
#   git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]
  # タグを打つ前に一通り通るか確かめたいとき用 (Release は作らない)。
  workflow_dispatch:

# 既定は読み取りだけ。Release を作るジョブでだけ書き込みを足す。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-version:
    name: バージョン確認
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # タグのコミットが main に載っているかを下で見るので、
          # 浅い取得ではなく履歴ごと持ってくる。
          fetch-depth: 0
      - id: meta
        run: |
          # workflow_dispatch では参照がタグではないので、バージョンから名前を作る。
          version="$(awk '/^\[workspace\.package\]/{f=1} f && /^version =/{gsub(/[",]/,""); print $3; exit}' Cargo.toml)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            # タグと Cargo.toml のバージョンがずれたまま公開しないようにする。
            if [ "$tag" != "v$version" ]; then
              echo "タグ $tag と Cargo.toml のバージョン $version が一致しません。" >&2
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          # v0.3.0-rc1 のようにハイフンを含むものはプレリリース扱い。
          case "$tag" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac
      # タグだけを押して、対応するコミットを main へ入れ忘れると、
      # main が古い版のまま crates.io と Release だけが進んでしまう。
      # crates.io の公開は取り消せないので、ビルドに入る前に止める。
      - name: タグが main に載っているか確認
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "タグ ${GITHUB_REF_NAME} のコミット ${GITHUB_SHA} が main にありません。" >&2
            echo "先に main へ push してから、そのコミットへタグを打ち直してください。" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon だけ。Intel Mac は対象にしない。
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            # 配布物の glibc / GTK の下限を固定する。GTK 4.10 以降が要るので
            # 22.04 (GTK 4.6) までは下げられない。
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: GTK4 / libadwaita を導入
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      # ランナーの CPU が変わっても arm64 で作るよう、ターゲットを明示する。
      - name: ビルド (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          rustup target add aarch64-apple-darwin
          cargo build --release -p gallery -p counter --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/gallery \
            target/aarch64-apple-darwin/release/counter dist/

      - name: ビルド (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          cargo build --release -p gallery -p counter
          mkdir -p dist
          cp target/release/gallery target/release/counter dist/

      # Windows App SDK ランタイムを同梱する (docs/windows-self-contained.md)。落とした人がランタイムを導入しなくても動く。
      # ビルドが target/release/naui-winappsdk/ にまとめる同梱物 (DLL、
      # マニフェスト、部品のライセンス条項と告知) を exe の隣へ置く。
      - name: ビルド (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          cargo build --release -p gallery -p counter --features gallery/self-contained
          mkdir -p dist
          cp target/release/gallery.exe target/release/counter.exe dist/
          cp -R target/release/naui-winappsdk/. dist/

      # Gallery は「メディア」画面の画像を、実行ファイルの隣の assets/ から読む。
      - name: 同梱物をそろえる
        shell: bash
        run: |
          set -eux
          cp LICENSE-MIT LICENSE-APACHE README.md dist/
          cp -R examples/gallery/assets dist/assets

      - name: パッケージを作る (macOS / .dmg)
        if: runner.os == 'macOS'
        run: |
          set -eux
          tag="${{ needs.check-version.outputs.tag }}"
          examples/gallery/packaging/macos/build-dmg.sh dist/gallery "${tag#v}" \
            "naui-gallery-$tag-${{ matrix.name }}.dmg"

      - name: cargo-deb を導入
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: パッケージを作る (Linux / .deb)
        if: runner.os == 'Linux'
        run: |
          set -eux
          cargo deb -p gallery --no-build \
            --output "naui-gallery-${{ needs.check-version.outputs.tag }}-${{ matrix.name }}.deb"
          dpkg-deb --info naui-gallery-*.deb
          dpkg-deb --contents naui-gallery-*.deb

      - name: WiX と Inno Setup を導入
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $tools 'wix.exe') extension add --global WixToolset.UI.wixext/5.0.2
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files*\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      # インストーラーには Gallery だけを入れる (Counter は書庫にだけ入れる)。
      - name: パッケージを作る (Windows / .msi と .exe)
        if: runner.os == 'Windows'
        run: |
          $tag = "${{ needs.check-version.outputs.tag }}"
          New-Item -ItemType Directory installer | Out-Null
          Copy-Item target/release/gallery.exe installer/
          Copy-Item -Recurse target/release/naui-winappsdk/* installer/
          Copy-Item -Recurse examples/gallery/assets installer/assets
          Copy-Item LICENSE-MIT, LICENSE-APACHE installer/
          ./examples/gallery/packaging/windows/build-installers.ps1 `
            -Source installer `
            -Version $tag.TrimStart('v') `
            -OutDir . `
            -Name "naui-gallery-$tag-${{ matrix.name }}"
          Get-ChildItem naui-gallery-*

      - name: 書庫を作る (tar.gz)
        if: runner.os != 'Windows'
        run: |
          set -eux
          name="naui-gallery-${{ needs.check-version.outputs.tag }}-${{ matrix.name }}"
          mv dist "$name"
          tar -czf "$name.tar.gz" "$name"

      - name: 書庫を作る (zip)
        if: runner.os == 'Windows'
        run: |
          $name = "naui-gallery-${{ needs.check-version.outputs.tag }}-${{ matrix.name }}"
          Rename-Item dist $name
          # Compress-Archive は最上位フォルダを含めるかが版で変わるので、
          # includeBaseDirectory を明示できる .NET 側を直接呼ぶ。
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD $name),
            (Join-Path $PWD "$name.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            naui-gallery-*.tar.gz
            naui-gallery-*.zip
            naui-gallery-*.dmg
            naui-gallery-*.deb
            naui-gallery-*.msi
            naui-gallery-*-setup.exe
          if-no-files-found: error

  build-web:
    name: web-wasm
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web
      - name: wasm-bindgen の版を Cargo.lock から取得
        id: wb
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          [ -n "$version" ] || { echo "Cargo.lock から取得できませんでした" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      - name: Gallery を wasm へビルド
        run: ./build.sh
        working-directory: examples/gallery/web
      - name: 書庫を作る
        run: |
          set -eux
          name="naui-gallery-${{ needs.check-version.outputs.tag }}-web-wasm"
          mkdir -p "$name"
          # build.sh が pkg/ と assets/ を web/ の下に用意する。
          cp examples/gallery/web/index.html "$name/"
          cp -R examples/gallery/web/pkg "$name/pkg"
          cp -R examples/gallery/web/assets "$name/assets"
          cp LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: web-wasm
          path: naui-gallery-*.tar.gz
          if-no-files-found: error

  publish-crates:
    name: crates.io へ公開
    # タグから始まった実行だけが公開する (workflow_dispatch はビルド確認まで)。
    # 4 環境ぶんのビルドが通ってから公開する (crates.io は取り消せないため)。
    # Release を作るのはこの後。よくある失敗 (トークンなど) のときに
    # Release だけ先に出来てしまうのを避ける。
    if: github.ref_type == 'tag'
    needs: [check-version, build, build-web]
    runs-on: ubuntu-24.04
    # トークン (CARGO_REGISTRY_TOKEN) はこの環境のシークレットから取る。
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      # naui-gtk / naui を検証ビルドするのに要る。
      - name: GTK4 / libadwaita を導入
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      - name: 公開
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -eu
          version="${TAG#v}"

          publish() {
            name="$1"
            shift
            # 途中で失敗した実行をやり直せるよう、公開済みのものは飛ばす。
            if curl -sSf -o /dev/null \
                 -A "naui release workflow" \
                 "https://crates.io/api/v1/crates/$name/$version"; then
              echo "$name $version は公開済みなので飛ばします。"
              return
            fi
            echo "$name $version を公開します。"
            cargo publish -p "$name" "$@"
          }

          # 依存の順に公開する。cargo publish は索引に載るまで待ってから戻る。
          publish naui-core
          # そのバックエンドの OS 以外ではビルドできないので検証を省く。
          publish naui-macos --no-verify
          publish naui-winui3 --no-verify
          publish naui-windows --no-verify
          # wasm / GTK 以外では空のクレートになるため、ここで検証できる。
          publish naui-web
          publish naui-gtk
          publish naui

  release:
    name: Release を作る
    # タグから始まった実行だけが公開する (workflow_dispatch はビルド確認まで)。
    if: github.ref_type == 'tag'
    # crates.io へ公開できてから Release を作る。
    needs: [check-version, build, build-web, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 公開
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -eux
          notes=$(cat <<'EOF'
          ## Downloads

          | OS | Install | Try without installing |
          | --- | --- | --- |
          | macOS (Apple Silicon) | `.dmg` | `macos-arm64.tar.gz` |
          | Windows 10 1903 or later (x64) | `.msi` or `-setup.exe` | `windows-x86_64.zip` |
          | Linux (x86_64) | `.deb` | `linux-x86_64.tar.gz` |
          | Web | | `web-wasm.tar.gz` |

          - macOS: Open the `.dmg` and drag the app to Applications.
          - Windows: The Windows App SDK runtime is bundled, so it runs without
            installing the runtime separately. The `.msi` installs for all users, and
            `-setup.exe` installs for the current user by default. When using the `.zip`,
            keep the contents of the extracted folder together. Use the bundled
            components in accordance with Microsoft's license terms
            (`WindowsAppSDK-LICENSE.txt`).
          - Linux: Requires GTK 4.10 or later and libadwaita 1.5 or later. Installing the
            `.deb` with `sudo apt install ./naui-gallery-*.deb` also installs anything
            missing (built on Ubuntu 24.04).
          - Web: Serve the extracted directory over HTTP
            (`python3 -m http.server 8080`).

          ## About signing

          None of the packages are code-signed, so a warning appears on first launch.

          - macOS: If you are told the app cannot be opened, launch it with
            "Open Anyway" in System Settings → Privacy & Security.
          - Windows: If SmartScreen appears, choose "More info" → "Run anyway".

          EOF
          )
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            ${{ needs.check-version.outputs.prerelease == 'true' && '--prerelease' || '' }}
