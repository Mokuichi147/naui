# 4 環境 (macOS / Windows / Linux / Web) のビルドとテスト。
#
# `cargo test --workspace` は使わない。GTK4 のテストは cfg で囲われておらず、
# Linux 以外では依存の入らない gtk / adw を use して壊れるため、
# 各ジョブが自分のプラットフォーム向けのパッケージだけを指定する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したときは、古い実行を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定は読み取りだけ。Release を作るジョブでだけ書き込みを足す。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI ではインクリメンタルビルドの生成物がキャッシュを膨らませるだけ。
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: 整形と lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # バックエンドに依存しない naui-core だけは、どの環境でも同じ結果に
      # なるのでここで見る。各バックエンドの clippy はそれぞれのジョブが持つ。
      - name: clippy (naui-core)
        run: cargo clippy -p naui-core --all-targets -- -D warnings
      # 壊れたリンクや、公開ドキュメントから私有項目へのリンクを拾う。
      - name: ドキュメント (naui-core)
        run: cargo doc --no-deps -p naui-core
        env:
          RUSTDOCFLAGS: -D warnings

  macos:
    name: macOS (AppKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build -p naui-core -p naui-macos -p naui -p counter -p gallery
      # AppKit の統合テストは harness = false の自前ランナーで、
      # ネイティブのコントロールを実際に作って操作する。
      #
      # ランナーにはポインティングデバイスが無く、macOS は場所を取る
      # スクローラを選ぶ。手元の Mac (重ね表示) と条件が違うが、そのまま
      # 測る。片方でしか出ない崩れを CI で拾えるようにするため。
      - name: テスト
        run: cargo test -p naui-core -p naui-macos -p naui

  windows:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    env:
      # 統合テストで取り付ける Windows App SDK ランタイムの版。
      #
      # `latest` にすると将来べつのパッチ版へ動いて、同じコミットでも
      # 違うランタイムで走ってしまう。完全な版で固定する。一覧は
      # https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads
      WINDOWS_APP_SDK: "2.3.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build -p naui-core -p naui-winui3 -p naui-windows -p naui -p counter -p gallery
      # 他の環境と同じく、バックエンドのクレートまで lint をかける。
      # naui-windows は WinRT の生ポインタを触るので、警告を残さない。
      - name: clippy
        run: cargo clippy -p naui-core -p naui-winui3 -p naui-windows -p naui --all-targets -- -D warnings
      # ランタイムを同梱する経路 (build.rs と naui-winui3::self_contained) は
      # フィーチャーを付けたときだけ組み込まれる。
      - name: clippy (ランタイム同梱)
        run: cargo clippy -p naui-winui3 -p naui-windows -p naui --all-targets --features naui/self-contained -- -D warnings
      # Gallery はランタイムのマニフェストを exe に埋め込む (examples/gallery/build.rs)。
      # 埋め込むマニフェストが naui のビルドで出来ていなければリンクで落ちる。
      - name: ビルド (ランタイム同梱、マニフェストの埋め込み)
        run: cargo build -p gallery --features self-contained
      # docs.rs は Windows 向けにこのクレート群を文書化するので、ここで見る。
      - name: ドキュメント
        run: cargo doc --no-deps -p naui-core -p naui-winui3 -p naui-windows -p naui
        env:
          RUSTDOCFLAGS: -D warnings
      # WinUI 3 のコントロールは Windows SDK ではなく Windows App SDK に
      # 入っていて、ランナーの標準イメージには無い。`crates/naui-windows/
      # tests/winui3.rs` が実コントロールを作るので、ここで取り付ける。
      #
      # 版は投影を作った 2.3 系にそろえる。naui が対応する下限は 1.3 だが
      # (`crates/naui-windows/src/sdk.rs`)、そちらは実機での確認に任せる。
      - name: Windows App SDK ランタイムを導入
        shell: pwsh
        run: |
          # 配布 URL は <系統>/<版> の形。系統は版の上 2 桁から作る。
          $version = $env:WINDOWS_APP_SDK
          $channel = ($version -split '\.')[0, 1] -join '.'
          $url = "https://aka.ms/windowsappsdk/$channel/$version/windowsappruntimeinstall-x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          & $exe --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App SDK $version の導入に失敗しました (終了コード $LASTEXITCODE)"
          }
      # 単体テストとドキュメンテーションテストに加えて、`winui3` の統合
      # テストが走る。こちらはランタイムを取り付け、`Application::Start` に
      # 入って本物のコントロールを作り、UI オートメーション経由で操作する。
      - name: テスト
        run: cargo test -p naui-core -p naui-winui3 -p naui-windows -p naui
      # 同じテストを、exe の隣へ同梱したランタイムで走らせる。build.rs が
      # nuget.org から部品を取ってきてテストの exe の隣 (`target/debug/deps/`)
      # へ並べるので、naui はフレームワークパッケージではなくそちらを使う。
      - name: テスト (ランタイム同梱)
        run: cargo test -p naui-winui3 -p naui-windows --features naui-windows/self-contained

  # Cargo.toml の rust-version (最低対応 Rust) で、ロックファイルのままビルド
  # できるかを見る。依存の版が上がって最低対応版で読めなくなっても、stable で
  # 走るほかのジョブでは気づけない。同梱モードは build.rs の依存 (zip など) が
  # 増えるので、そちらも見る。
  windows-msrv:
    name: Windows (最低対応 Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 最低対応 Rust の版を読む
        id: msrv
        shell: bash
        run: |
          version="$(awk '/^\[workspace\.package\]/{f=1} f && /^rust-version =/{gsub(/[",]/,""); print $3; exit}' Cargo.toml)"
          echo "最低対応 Rust: $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: ビルド (フレームワーク依存)
        run: cargo check -p naui -p counter -p gallery --locked
      - name: ビルド (ランタイム同梱)
        run: cargo check -p naui -p counter -p gallery --features gallery/self-contained --locked

  # ランタイムを同梱した exe が、Windows 11 24H2 より前の Windows でも動くかを
  # 見る。Windows Server 2022 (ビルド 20348) は 24H2 (26100) より前なので、
  # Windows App SDK が reg-free WinRT を自前の実装へ差し替え、exe に埋め込んだ
  # マニフェストを読み、無いクラスは OS の実装へ回す
  # (crates/naui-winui3/src/self_contained.rs)。マニフェストを埋め込んだ exe と
  # 埋め込まない exe の両方を確かめる。
  # Windows App SDK のランタイムは導入しない。同梱物だけで動くことも確かめる。
  windows-legacy:
    name: Windows Server 2022 (ランタイム同梱、24H2 より前)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Appx モジュールは Windows Server 2022 の PowerShell 7 では読み込めないので、
      # Windows PowerShell で調べる。記録のためだけなので、調べられなくても続ける。
      # Windows PowerShell はスクリプトを UTF-8 として読まないため、出力は英語にする。
      - name: Windows App SDK ランタイムが入っていないことを記録
        shell: powershell
        continue-on-error: true
        run: |
          $packages = @(Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime*')
          Write-Host "Installed Windows App SDK runtime packages: $($packages.Count)"
          $packages | ForEach-Object { Write-Host "  $($_.PackageFullName)" }
      # Gallery の build.rs が、同梱するマニフェストを exe に埋め込む。
      # README が Windows 10 1809 向けに案内している形。
      - name: ビルド (マニフェストを埋め込む)
        run: cargo build -p gallery --features self-contained
      - name: 起動 (マニフェストを埋め込む)
        shell: pwsh
        run: ./.github/scripts/gallery-smoke.ps1 -Exe target/debug/gallery.exe -Label embedded
      # 埋め込まない exe。naui が実行時に読み込んだマニフェストを、OS の
      # reg-free WinRT が見つける。埋め込んだほうが落ちても、こちらは確かめる。
      - name: ビルド (マニフェストを埋め込まない)
        if: ${{ !cancelled() }}
        run: cargo build -p gallery --features naui/self-contained
      - name: 起動 (マニフェストを埋め込まない)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/gallery-smoke.ps1 -Exe target/debug/gallery.exe -Label plain
      # 起動確認が失敗したときに撮ったスクリーンショット。
      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-legacy-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore

  linux:
    name: Linux (GTK4 / libadwaita)
    runs-on: ubuntu-latest
    env:
      # Xvfb 上では GL が使えないので、GSK はソフトウェアの cairo で描く。
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
      # at-spi のバスが無い環境での警告を止める。`test` はバスへつながずに
      # 読み上げの属性だけを持つので、`set_accessible_label` を確かめられる。
      GTK_A11Y: test
    steps:
      - uses: actions/checkout@v4
      # 日本語フォントも入れる。`checkbox_indicator_is_aligned_to_text` は
      # 日本語の行の ascent が大きく取られることを前提に印の位置を測るので、
      # 日本語を持つフォントが無いと欧文へ代替されて成り立たない。
      - name: GTK4 / libadwaita と日本語フォントを導入
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config \
            xvfb dbus \
            fonts-noto-cjk
      # Xvfb には設定デーモンが無いので、GTK は組み込みの既定 "Sans 10" を
      # 使う。デスクトップの既定 (Ubuntu 24.04 は 11pt) より 1pt 小さく、
      # チェックボックスの印を字面へ下げる余地が行の高さに残らないため、
      # `checkbox_indicator_is_aligned_to_text` が成り立たない。
      # デスクトップと同じ大きさにそろえる。
      - name: GTK のフォント設定をデスクトップにそろえる
        run: |
          mkdir -p "$HOME/.config/gtk-4.0"
          printf '[Settings]\ngtk-font-name=Sans 11\n' \
            >"$HOME/.config/gtk-4.0/settings.ini"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build -p naui-core -p naui-gtk -p naui -p counter -p gallery
      # GTK4 はディスプレイを要求する。libadwaita は D-Bus のセッションバスから
      # 配色設定を読むため、dbus-run-session も通す。
      - name: テスト
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dbus-run-session -- \
            cargo test -p naui-core -p naui-gtk -p naui

  web:
    name: Web (wasm / DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen CLI は Cargo.lock のクレートと同じ版でなければならない。
      - name: wasm-bindgen の版を Cargo.lock から取得
        id: wb
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          [ -n "$version" ] || { echo "Cargo.lock から取得できませんでした" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      # __api_contract がバックエンド間のシグネチャのずれを型検査で拾う。
      - name: API 互換性を確認
        run: cargo check --target wasm32-unknown-unknown -p naui-core -p naui-web -p naui
      # Web バックエンドはウィジェットを自前で描かず、ブラウザの挙動
      # (`<label>` を押すとチェックが入る、同じ name のラジオが排他になる、
      # Flexbox が子を並べる) にそのまま乗っている。そこは実ブラウザの上
      # でしか確かめられないので、DOM のイベントを実際に起こして測る。
      #
      # ブラウザとドライバはランナーのイメージに入っている。どちらの
      # ブラウザを使うかは、ランナーが CHROMEDRIVER / GECKODRIVER の
      # どちらを見つけるかで決まるため、1 つずつ渡して 2 回走らせる。
      # DOM の実装差はここで拾う。
      - name: ブラウザテスト (Chrome)
        run: |
          driver="${CHROMEWEBDRIVER:-/usr/bin}/chromedriver"
          [ -x "$driver" ] || { echo "chromedriver が見つかりません: $driver" >&2; exit 1; }
          CHROMEDRIVER="$driver" \
            cargo test --target wasm32-unknown-unknown -p naui-web
      - name: ブラウザテスト (Firefox)
        run: |
          driver="${GECKOWEBDRIVER:-/usr/bin}/geckodriver"
          [ -x "$driver" ] || { echo "geckodriver が見つかりません: $driver" >&2; exit 1; }
          GECKODRIVER="$driver" \
            cargo test --target wasm32-unknown-unknown -p naui-web
      - name: Gallery を wasm へビルド
        run: ./build.sh
        working-directory: examples/gallery/web
