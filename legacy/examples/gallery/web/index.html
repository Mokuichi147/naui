<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>miui gallery</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f172a;
        }
      }
      /* winit が body へ追加するキャンバス。
         大きさはランタイムがビューポートに合わせて更新する。 */
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init from "./pkg/gallery.js";
      init();
    </script>
  </body>
