[workspace]
resolver = "2"
members = [
    "crates/naui-core",
    "crates/naui-macos",
    "crates/naui-web",
    "crates/naui-windows",
    "crates/naui-winui3",
    "crates/naui-gtk",
    "crates/naui",
    "crates/naui-app",
    "crates/naui-charts",
    "examples/counter",
    "examples/i18n",
    "examples/todo",
    "examples/checklist",
    "examples/search",
    "examples/notes/app",
    "examples/notes/core",
    "examples/notes/l10n",
    "examples/notes/services/store",
    "examples/notes/screens/sidebar",
    "examples/notes/screens/list",
    "examples/notes/screens/editor",
    "examples/signup",
    "examples/gallery",
    "examples/charts",
]
exclude = ["tools/winui3-bindgen"]

[workspace.package]
version = "0.18.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mokuichi147/naui"

[workspace.dependencies]
naui-core = { path = "crates/naui-core", version = "0.18.0" }
naui-macos = { path = "crates/naui-macos", version = "0.18.0" }
naui-web = { path = "crates/naui-web", version = "0.18.0" }
naui-windows = { path = "crates/naui-windows", version = "0.18.0" }
naui-winui3 = { path = "crates/naui-winui3", version = "0.18.0" }
naui-gtk = { path = "crates/naui-gtk", version = "0.18.0" }
naui = { path = "crates/naui", version = "0.18.0" }
naui-app = { path = "crates/naui-app", version = "0.18.0" }
naui-charts = { path = "crates/naui-charts", version = "0.18.0" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
