[package]
name = "naui-winui3"
description = "WinRT projection of WinUI 3 (Windows App SDK) used by naui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# クレート全体が `cfg(target_os = "windows")` で囲ってあり、他の環境では
# 公開 API が空になるため、docs.rs でも Windows 向けの文書を作らせる。
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[features]
# Windows App SDK ランタイムを exe に同梱する。ビルド時に nuget.org から
# 部品を取ってきて exe の出力先へ並べ、実行時はそれを優先して使う。
# 無効なら、OS へ導入されたフレームワークパッケージを探して使う。
self-contained = [
    "dep:flate2",
    "dep:roxmltree",
    "dep:sha2",
    "dep:zip",
    "windows/Win32_System_ApplicationInstallationAndServicing",
    "windows/Win32_System_Com",
]

# Windows 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_Activation",
    "ApplicationModel_Contacts",
    "ApplicationModel_DataTransfer_DragDrop",
    "Devices_Geolocation",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Globalization_NumberFormatting",
    "Graphics",
    "Graphics_Imaging",
    "Media_Casting",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Core",
    "UI_Text",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_WinRT",
] }

# `self-contained` のときだけ build.rs が使う。部品の `.nupkg` を確かめて
# (SHA-512)、展開し、reg-free WinRT のマニフェストを作る。
#
# zip の `deflate` は圧縮用の zopfli (Rust 1.88 以降) まで引き込むので使わず、
# 展開に要る flate2 だけを有効にする。flate2 はここで実装 (rust_backend) を選ぶ。
[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
roxmltree = { version = "0.20", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"], optional = true }

# build.rs のマニフェスト生成 (`build/manifest.rs`) をテストから確かめる。
[target.'cfg(target_os = "windows")'.dev-dependencies]
roxmltree = "0.20"
