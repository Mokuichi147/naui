[package]
name = "naui-winui3"
description = "naui が使う WinUI 3 (Windows App SDK) の WinRT 投影"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# クレート全体が `cfg(target_os = "windows")` で囲ってあり、他の環境では
# 公開 API が空になるため、docs.rs でも Windows 向けの文書を作らせる。
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

# Windows 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_Activation",
    "ApplicationModel_Contacts",
    "ApplicationModel_DataTransfer_DragDrop",
    "Devices_Geolocation",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Globalization_NumberFormatting",
    "Graphics",
    "Graphics_Imaging",
    "Media_Casting",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Core",
    "UI_Text",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_WinRT",
] }
