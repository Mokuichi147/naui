[package]
name = "naui-app"
description = "Model–View–Update structure for naui apps: typed messages, a queue that never re-enters update, and render through naui's setters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gui", "mvu", "elm", "naui"]
categories = ["gui"]
readme = "README.md"

[dependencies]
naui.workspace = true

[dev-dependencies]
naui-core.workspace = true

# Mounted を AsWidget としてコンテナへ渡す経路を、naui::testing で各環境の本物の
# イベントループの上で確かめる。naui::test_cases! が入口を書く。
[[test]]
name = "mounted"
harness = false

# Web ではケースごとに #[wasm_bindgen_test] をブラウザで走らせる。
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
