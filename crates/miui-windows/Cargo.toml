[package]
name = "miui-windows"
description = "miui の Windows バックエンド。WinUI 3 (Fluent 2) の実コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miui-core.workspace = true

# Windows 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Graphics", "System"] }
winio-winui3 = { version = "0.4", features = [
    "UI_Composition",
    "UI_Dispatching",
    "UI_Windowing",
    "UI_Xaml",
    "UI_Xaml_Controls",
    "UI_Xaml_Controls_Primitives",
    "UI_Xaml_Markup",
    "UI_Xaml_Media",
    "UI_Xaml_XamlTypeInfo",
    "UI_Xaml_Input",
    "UI_Xaml_Interop",
] }
