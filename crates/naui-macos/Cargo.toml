[package]
name = "naui-macos"
description = "naui の macOS バックエンド。AppKit の実コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
naui-core.workspace = true
objc2 = "0.6"
# 再生位置を定期的に受け取るブロックを作るため。
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSIndexSet",
    "NSString",
    "NSKeyValueObserving",
    "NSNotification",
    "NSGeometry",
    "NSObjCRuntime",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSAppearance",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSImageView",
    "NSOpenPanel",
    "NSPanel",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPathControl",
    "NSPathControlItem",
    "NSProgressIndicator",
    "NSResponder",
    "NSScrollView",
    "NSSavePanel",
    "NSSegmentedControl",
    "NSSlider",
    "NSStackView",
    "NSTabView",
    "NSTabViewItem",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableView",
    "NSTextField",
    "NSText",
    "NSTextContainer",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }

# 動画 / 音声。再生は AVFoundation が行い、再生バーは AVKit の AVPlayerView が出す。
objc2-av-kit = { version = "0.3", default-features = false, features = [
    "std",
    "AVPlayerView",
    "objc2-app-kit",
    "objc2-av-foundation",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAnimation",
    "AVAsset",
    "AVPlayer",
    "AVPlayerItem",
    "objc2-core-media",
    # 再生位置を定期的に受け取る addPeriodicTimeObserver… のため。
    "block2",
    "dispatch2",
] }
# 再生位置と長さを表す CMTime のため。
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMTime",
    "objc2",
] }

[dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSText",
    "NSTextField",
    "NSTextInputClient",
    "NSTextView",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSRange",
    "NSRunLoop",
] }

[[test]]
name = "appkit"
path = "tests/appkit.rs"
# AppKit はメインスレッドを要求するが、標準ハーネスは別スレッドで走らせるため。
harness = false
