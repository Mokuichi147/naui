[package]
name = "naui-macos"
description = "naui の macOS バックエンド。AppKit の実コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# クレート全体が AppKit に依存し、macOS 以外ではビルドできないため、
# docs.rs でも Apple 向けの文書を作らせる。
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = []

[dependencies]
naui-core.workspace = true
objc2 = "0.6"
# 再生位置を定期的に受け取るブロックを作るため。
block2 = "0.6"
# 別スレッドから UI スレッドへ仕事を投げるため (メインキュー)。
# objc2-av-foundation の feature 経由で既に依存グラフへ入っているものと同じ版に解決される。
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSCalendar",
    "NSDate",
    "NSDictionary",
    "NSIndexSet",
    "NSString",
    "NSKeyValueObserving",
    "NSNotification",
    "NSGeometry",
    "NSObjCRuntime",
    "NSSortDescriptor",
    "NSTimer",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAccessibilityProtocols",
    "NSActionCell",
    "NSAlert",
    "NSApplication",
    "NSAppearance",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSComboBox",
    "NSComboBoxCell",
    "NSControl",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSFont",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSImageView",
    "NSOpenPanel",
    "NSOutlineView",
    "NSPanel",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPathControl",
    "NSPathControlItem",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSScrollView",
    "NSSavePanel",
    "NSSearchField",
    "NSSecureTextField",
    "NSSegmentedControl",
    "NSShadow",
    "NSSlider",
    "NSSplitView",
    "NSStackView",
    "NSStepper",
    "NSSwitch",
    "NSTabView",
    "NSTabViewItem",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableHeaderCell",
    "NSTableHeaderView",
    "NSTableView",
    "NSTextFieldCell",
    "NSTextField",
    "NSText",
    "NSTextContainer",
    "NSTextView",
    "NSToolbar",
    "NSToolbarItem",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    # トーストの角を丸めるため、NSView から CALayer をたどれるようにする。
    "objc2-quartz-core",
] }

# トーストの角丸 (CALayer)。
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    # cornerRadius が CGFloat を使う。
    "objc2-core-foundation",
] }

# 動画 / 音声。再生は AVFoundation が行い、再生バーは AVKit の AVPlayerView が出す。
objc2-av-kit = { version = "0.3", default-features = false, features = [
    "std",
    "AVPlayerView",
    "objc2-app-kit",
    "objc2-av-foundation",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAnimation",
    "AVAsset",
    "AVPlayer",
    "AVPlayerItem",
    "objc2-core-media",
    # 再生位置を定期的に受け取る addPeriodicTimeObserver… のため。
    "block2",
    "dispatch2",
] }
# 再生位置と長さを表す CMTime のため。
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMTime",
    "objc2",
] }

[dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSComboBox",
    "NSComboBoxCell",
    "NSOutlineView",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSClipView",
    "NSControl",
    "NSImage",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSSavePanel",
    "NSScroller",
    "NSScrollView",
    "NSSearchField",
    "NSSecureTextField",
    "NSStepper",
    "NSSwitch",
    "NSText",
    "NSTextField",
    "NSTextInputClient",
    "NSTextView",
    "NSToolbar",
    "NSToolbarItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSSortDescriptor",
    "NSRange",
    "NSRunLoop",
] }

[[test]]
name = "appkit"
path = "tests/appkit.rs"
# AppKit はメインスレッドを要求するが、標準ハーネスは別スレッドで走らせるため。
harness = false
