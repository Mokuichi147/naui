[package]
name = "miui-web"
description = "miui の Web バックエンド。DOM の標準コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miui-core.workspace = true

# wasm 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `File::webkitRelativePath` は web-sys が束ねていないため、
# プロパティを直接読むのに js-sys を使う。
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "CssStyleDeclaration",
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlButtonElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlImageElement",
    "HtmlLabelElement",
    "HtmlMediaElement",
    "HtmlProgressElement",
    "Node",
    "Url",
    "Window",
] }
