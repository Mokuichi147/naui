[package]
name = "naui-web"
description = "naui の Web バックエンド。DOM の標準コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# クレート全体が `cfg(target_arch = "wasm32")` で囲ってあり、他の環境では
# 公開 API が空になるため、docs.rs でも wasm 向けの文書を作らせる。
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = []

[dependencies]
naui-core.workspace = true

# wasm 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `File::webkitRelativePath` は web-sys が束ねていないため、
# プロパティを直接読むのに js-sys を使う。
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "CssStyleDeclaration",
    "Blob",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlButtonElement",
    "HtmlDataListElement",
    "HtmlDetailsElement",
    "HtmlDialogElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlImageElement",
    "HtmlLabelElement",
    "HtmlMediaElement",
    "HtmlOptionElement",
    "HtmlOptionsCollection",
    "HtmlProgressElement",
    "KeyboardEvent",
    "MouseEvent",
    "HtmlSelectElement",
    "HtmlTableElement",
    "HtmlTextAreaElement",
    "Node",
    "PointerEvent",
    "Url",
    "Window",
] }

# ブラウザ上で走らせるテスト (`tests/dom.rs`)。実ブラウザが要るので、
# `cargo test --target wasm32-unknown-unknown -p naui-web` で動かす。
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
# テストはブラウザ側の実挙動 (実イベントの発火、Flexbox の実レイアウト、
# 算出後のスタイル) を直接読むので、テスト側にも web-sys が要る。
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Node",
    "Window",
] }
