[package]
name = "naui"
description = "各 OS のネイティブ UI を 1 つの API から扱う軽量 GUI (WinUI 3 / AppKit / GTK4 / DOM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gui", "native", "appkit", "winui", "gtk4"]
categories = ["gui"]

# ウィジェット型はビルド対象のバックエンドから再エクスポートするので、
# 既定の Linux (GTK4) に加えて他の 3 環境の文書も作らせる。
# default-target を省くと targets の先頭が既定になってしまうため、明示する。
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]

[features]
# Windows: Windows App SDK ランタイムを exe に同梱する。ビルド時に nuget.org から
# 部品を取ってきて exe の出力先へ並べ、実行時はそれを使う。利用者が
# ランタイムを導入しなくて済む代わりに、配布物が 60MB ほど増える。
# ほかの OS では何もしない。
self-contained = ["naui-windows/self-contained"]

[dependencies]
naui-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
naui-macos.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
naui-web.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
naui-windows.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
naui-gtk.workspace = true
