[package]
name = "naui-windows"
description = "naui の Windows バックエンド。WinUI 3 (Fluent 2) の実コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
naui-core.workspace = true

# Windows 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "System",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winio-winui3 = { version = "0.4", features = [
    "UI_Composition",
    "UI_Composition_SystemBackdrops",
    "UI_Dispatching",
    "UI_Windowing",
    "UI_Xaml",
    "UI_Xaml_Controls",
    "UI_Xaml_Controls_Primitives",
    "UI_Xaml_Markup",
    "UI_Xaml_Media",
    "UI_Xaml_XamlTypeInfo",
    "UI_Xaml_Input",
    "UI_Xaml_Interop",
    "native",
] }
