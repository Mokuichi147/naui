[package]
name = "naui-windows"
description = "Windows backend for naui, using real WinUI 3 (Fluent 2) controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# クレート全体が `cfg(target_os = "windows")` で囲ってあり、他の環境では
# 公開 API が空になるため、docs.rs でも Windows 向けの文書を作らせる。
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[features]
# Windows App SDK ランタイムを exe に同梱する。詳しくは naui-winui3 の同名の
# フィーチャーを参照。
self-contained = ["naui-winui3/self-contained"]

[dependencies]
naui-core.workspace = true

# Windows 以外では空のクレートになるので、依存も引き込まない。
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
# メニューの項目の並び (`IVector<MenuFlyoutItemBase>`) を受け渡すため。投影
# (naui-winui3) と同じ版にそろえる。
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Globalization",
    "Globalization_NumberFormatting",
    "Graphics",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "System",
    "UI",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
naui-winui3.workspace = true

# 統合テストは WinUI 3 の実コントロールを直に読むので、投影 (naui-winui3) と
# WinRT の基本型が要る。Windows 以外ではクレートごと空になるため引き込まない。
[target.'cfg(target_os = "windows")'.dev-dependencies]
naui-winui3.workspace = true
windows-core = "0.62"

[[test]]
name = "winui3"
path = "tests/winui3.rs"
# WinUI 3 のコントロールは UI スレッドの STA でしか作れず、`Application::Start`
# は 1 プロセスで 1 回しか呼べない。テストごとに別スレッドで走る標準ハーネス
# では成り立たないため、自前のランナーを 1 本だけ回す。
harness = false
