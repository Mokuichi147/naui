[package]
name = "naui-gtk"
description = "Linux backend for naui (GTK4 / libadwaita)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
naui-core.workspace = true

# このクレートの中身は同じ cfg で丸ごと囲ってあるので、対象外の OS では
# 空のクレートになる。GTK4 の開発用ライブラリを要求しないよう、依存も
# 同じ条件で絞る (macOS から `cargo check --workspace` を通すため)。
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.9.7", package = "gtk4", features = ["v4_10"] }
# 描画面の文字を Pango のレイアウトで cairo へ描くため。
# gtk4 と同じ gtk-rs-core の系列 (glib・cairo-rs・pango) に揃える。版が
# ずれると cairo の Context の型が別物になって渡せない。範囲を上限付きで
# 書くのは、`cargo upgrade` に pinned として扱わせ、gtk4 と別に上げさせない
# ため (範囲は `"0.20"` と同じ)。
pangocairo = ">=0.20, <0.21"

[[test]]
name = "gtk4"
path = "tests/gtk4.rs"
# GTK4 はメインスレッドを要求するが、標準ハーネスは別スレッドで走らせるため。
harness = false
