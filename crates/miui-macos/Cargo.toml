[package]
name = "miui-macos"
description = "miui の macOS バックエンド。AppKit の実コントロールを使う"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miui-core.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSString",
    "NSNotification",
    "NSGeometry",
    "NSObjCRuntime",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSAppearance",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSLayoutConstraint",
    "NSPathControl",
    "NSPathControlItem",
    "NSProgressIndicator",
    "NSResponder",
    "NSSegmentedControl",
    "NSSlider",
    "NSStackView",
    "NSTabView",
    "NSTabViewItem",
    "NSTextField",
    "NSText",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }

[dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSControl", "NSView"] }

[[test]]
name = "appkit"
path = "tests/appkit.rs"
# AppKit はメインスレッドを要求するが、標準ハーネスは別スレッドで走らせるため。
harness = false
